<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        turtle: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16',

    <style>
        body {
            background-color: #09130e;
            background-image: 
                radial-gradient(at 0% 0%, rgba(22, 163, 74, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 46, 22, 0.3) 0px, transparent 50%);
            color: #e2e8f0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Smooth transformation viewport for the turtle canvas */
        #viewport {
            perspective: 1200px;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center center;
        }

        /* Scute / Shell Tile Hover & Visual Styles */
        .scute {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }

        .scute:hover {
            transform: scale(1.04) translateY(-3px);
            filter: drop-shadow(0 12px 20px rgba(34, 197, 94, 0.4));
        }

        .scute path {
            transition: fill 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease;
        }

        .scute:hover path {
            fill: #166534 !important;
            stroke: #4ade80 !important;
            stroke-width: 3px !important;
        }

        /* Pulse animation for interactive indicator */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .turtle-idle {
            animation: subtle-pulse 4s ease-in-out infinite;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(13, 27, 19, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Custom Scrollbar for modal content */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(5, 46, 22, 0.2);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(34, 197, 94, 0.4);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(34, 197, 94, 0.7);
        }
    </style>
</head>

        const viewport = document.getElementById('viewport');
        const modalContainer = document.getElementById('modal-container');
        const modalBox = modalContainer.querySelector('.glass-panel');

        // Handles smoothly zooming into specific tile coordinates
        function zoomToTile(tileId, key) {
            const data = gentData[key];
            if (!data) return;

            // Coordinates mapping for optimal camera zoom offset relative to svg center (300, 300)
            const zoomOffsets = {
                'tile-deeper-look':   { scale: 2.2, x: 0,    y: 0 },
                'tile-early-life':    { scale: 2.3, x: 0,    y: 120 },
                'tile-eyp':           { scale: 2.3, x: -120, y: 80 },
                'tile-tech-bro':      { scale: 2.3, x: -120, y: -80 },
                'tile-present-gent':  { scale: 2.3, x: 120,  y: -80 },
                'tile-hobbies':       { scale: 2.3, x: 120,  y: 80 }
            };

            const offset = zoomOffsets[tileId] || { scale: 2, x: 0, y: 0 };

            // Apply SVG camera transform zoom
            viewport.style.transform = `scale(${offset.scale}) translate(${offset.x}px, ${offset.y}px)`;

            // Inject content into modal
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-subtitle').innerText = data.subtitle;
            document.getElementById('modal-icon').className = `fa-solid ${data.icon}`;
            document.getElementById('modal-body').innerHTML = data.content;

            // Display modal popup after zoom transition starts
            setTimeout(() => {
                modalContainer.classList.remove('opacity-0', 'pointer-events-none');
                modalBox.classList.remove('scale-90');
                modalBox.classList.add('scale-100');
            }, 300);
        }

        // Resets camera back to default view
        function resetZoom() {
            // Hide modal
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-90');
            modalContainer.classList.add('opacity-0', 'pointer-events-none');

            // Reset viewport transformation smoothly
            setTimeout(() => {
                viewport.style.transform = 'scale(1) translate(0px, 0px)';
            }, 150);
        }

        // Close modal when pressing ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') resetZoom();
        });
    </script>
</body>
</html>
